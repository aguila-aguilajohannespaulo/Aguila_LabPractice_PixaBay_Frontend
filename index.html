<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paulo Aguila's Search API Query</title>
  <link rel="stylesheet" href="css/project.css" />
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="main">
    <header>
      <nav>
        <h2>Aguila's Search API Query</h2>
      </nav>
    </header>
    <div class="hero">
      <h1 id="headline">Aguila's Search API Query</h1>
      <p><i>Type a keyword above or try the challenges below</i></p>
      <form id="search-form" class="search-form-wrapper">
        <div class="searchBar">
          <input type="text" id="search-input" placeholder="Search for photos or videos..." required>
          <select id="media-type" class="media-select">
            <option value="photo">Photos</option>
            <option value="video">Videos</option>
          </select>
          <button type="submit" class="set-btn btn-hub" style="margin-top: 0; border: none; cursor: pointer;">Search</button>
        </div>
      </form>
      <p><i>Challenge Buttons (Which is also used as a sample button clicks)</i></p>
    </div>
    <section class="challenges">
      <div class="button-row">
        <button class="challenge-btn set-btn btn-act" data-query="rocket launch" data-type="photo">Rocket Launch</button>
        <button class="challenge-btn set-btn btn-ft" data-query="basketball" data-type="video">Basketball</button>
        <button class="challenge-btn set-btn btn-act" data-query="forest" data-type="photo">Forest</button>
        <button class="challenge-btn set-btn btn-ft" data-query="road forest" data-type="video">Road Forest</button>
        <button class="challenge-btn set-btn btn-act" data-query="space" data-type="photo">Space</button>
        <button class="challenge-btn set-btn btn-ft" data-query="football" data-type="video">Football</button>
        <button class="challenge-btn set-btn btn-act" data-query="city" data-type="photo">City</button>
        <button class="challenge-btn set-btn btn-ft" data-query="Rain Forest" data-type="video">Rain Forest</button>
      </div>
    </section>

    <div id="loading-indicator" class="hidden">
      <div class="spinner"></div>
      <p style="text-align: center; color: #86a6da; font-weight: 600;">Retrieving beautiful media...</p>
    </div>

    <div id="error-banner" class="error-banner hidden"></div>

    <div class="items" id="results-grid">
    </div>
  </div>

  <script>
    // Title Randomizer Animation 
    const title = document.getElementById("headline");
    const originalText = title.innerText;
    const words = ["Check them out!", "Search Anything", "Random Thoughts", "Pixabay API", "Searching..."];
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz1234567890.,/';[]]!@#$^*()_+=";

    function scrambleTo(target, callback) {
      let iteration = 0;
      const interval = setInterval(() => {
        title.innerText = target
          .split("")
          .map((letter, index) => {
            if (index < iteration) return target[index];
            return letters[Math.floor(Math.random() * letters.length)];
          })
          .join("");

        if (iteration >= target.length) {
          clearInterval(interval);
          if (callback) callback();
        }

        iteration += 1 / 2;
      }, 50);
    }

    function runAnimation() {
      const randomWord = words[Math.floor(Math.random() * words.length)];
      scrambleTo(randomWord, () => {
        setTimeout(() => {
          scrambleTo(originalText);
        }, 1500);
      });
    }
    setInterval(runAnimation, 10000);
  </script>
</body>
</html>
